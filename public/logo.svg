<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" fill="none">
  <!-- Shield Mark -->
  <g transform="translate(6, 4) scale(0.88)">
    <!-- Rounded Shield Outline -->
    <path
      d="M 50 12
         C 67 12 79 15 84 26
         C 88 38 87 56 77 72
         C 67 86 56 91 50 92
         C 44 91 33 86 23 72
         C 13 56 12 38 16 26
         C 21 15 33 12 50 12 Z"
      stroke="#00C9C8"
      stroke-width="7.5"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Circular Dial Arc with Gap on Right -->
    <path
      d="M 64.5 35.5
         A 20.5 20.5 0 1 0 64.5 64.5"
      stroke="#FFFFFF"
      stroke-width="6"
      stroke-linecap="round"
    />

    <!-- Compass Pointer Needle -->
    <polygon
      points="64,36 51.5,54.5 37.5,62.5 45.5,48.5"
      fill="#00C9C8"
    />
  </g>

  <!-- Typography -->
  <!-- "BudgetAI" in Crisp White -->
  <text
    x="98"
    y="51"
    fill="#FFFFFF"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Inter, Roboto, sans-serif"
    font-size="42"
    font-weight="700"
    letter-spacing="-0.02em"
  >Budget<tspan font-weight="700">AI</tspan></text>

  <!-- "Gov" in Vibrant Cyan -->
  <text
    x="100"
    y="76"
    fill="#00C9C8"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Inter, Roboto, sans-serif"
    font-size="18"
    font-weight="700"
    letter-spacing="0.02em"
  >Gov</text>
</svg>
